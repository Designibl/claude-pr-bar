name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifests are valid JSON
        run: |
          node -e 'for (const f of ["package.json"]) {}' 2>/dev/null || true
          node -e 'JSON.parse(require("fs").readFileSync(".claude-plugin/plugin.json","utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("hooks/hooks.json","utf8"))'
      - name: Hooks module compiles
        run: npx --yes esbuild hooks/register.tsx --loader:.tsx=tsx --jsx-factory=h --format=esm --log-level=warning --outfile=/dev/null
